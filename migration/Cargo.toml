[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1.13.2", features = ["attributes", "tokio1"] }
regex = { version = "1.11.2" }  #   for fixing regex error of sea-orm-cli on compile

[dependencies.sea-orm-migration]
version = "1.1.14"
features = ["runtime-tokio-native-tls", "sqlx-postgres"]